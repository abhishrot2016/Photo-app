name: Build Flutter APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
      - name: Generate Scaffold & Setup Pubspec
        run: |
          flutter create . --platforms=android --project-name=whos_who --org=com.whos.who.app
          rm -rf test/
          # Write all required dependencies into pubspec.yaml automatically
          cat << 'EOF' > pubspec.yaml
          name: whos_who
          description: "A small offline app for remembering faces and names."
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            sqflite: ^2.3.0
            path_provider: ^2.1.1
            path: ^1.8.3
            image_picker: ^1.0.4
            archive: ^3.4.10
            share_plus: ^7.2.1
            file_picker: ^6.1.1

          flutter:
            uses-material-design: true
          EOF
      - name: Fix Android Gradle Config & Multidex
        run: |
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/g' android/app/build.gradle || true
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' android/app/build.gradle || true
          if ! grep -q "namespace" android/app/build.gradle; then
            sed -i 's/android {/android {\n    namespace "com.whos.who.app"/g' android/app/build.gradle
          fi
          sed -i '/defaultConfig {/a \    multiDexEnabled true' android/app/build.gradle
      - run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          
